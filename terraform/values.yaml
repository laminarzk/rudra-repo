    force_destroy: true
    transition_days: 30
    glacier_days: 90
    log_retention_days: 180
    object_lock_mode: GOVERNANCE
    cost_center: dataoutbound-dev-01
  child_export_dag_mwaa:
    kms_deletion_window_days: 7
    log_retention_days: 90
    vpc_id: vpc-dev-REPLACE
    vpc_cidr: 10.0.0.0/16
    db_subnet_cidrs:
    - 10.0.5.0/24
    - 10.0.6.0/24
    cost_center: dataoutbound-dev-01
