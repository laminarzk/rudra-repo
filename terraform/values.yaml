    storage_account_name: acmedoblobdev
    storage_account_resource_group: rg-dataoutbound-dev-customer
    container_name: dataoutbound-exports
    workload_identity_issuer: https://oidc.dev.acme.internal
    workload_identity_subject: system:dataoutbound-dev:transform_encrypt_dag
