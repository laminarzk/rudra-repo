[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataoutbound"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "apache-airflow>=2.7,<3",
  "azure-identity>=1.15,<2",
  "azure-storage-blob>=12.19,<13",
  "boto3>=1.34,<2",
  "croniter>=2.0,<4",
  "cryptography>=42,<44",
  "fastapi>=0.110,<1",
  "google-cloud-storage>=2.14,<3",
  "json",
  "paramiko>=3.4,<4",
  "psycopg2-binary>=2.9,<3",
  "pydantic>=2.6,<3",
  "pyjwt>=2.8,<3",
  "pyspark>=3.5,<4.0",
  "python-gnupg>=0.5,<1",
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.27,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["dataoutbound"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
